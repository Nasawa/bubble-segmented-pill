        - name: label_color_1
          label: Section 1 label color (hex, blank = pill label color)
          prefix: '#'
          visible_if: "((s) => Array.isArray(s) ? s.length : ((s?.bottom?.length) || (s?.main?.length) || 0))(card?.sub_button) >= 1"
          selector:
            text: {}
    - type: expandable
      name: section_2
      title: Section 2
      icon: mdi:numeric-2-box-outline
      flatten: true
      expanded: false
      visible_if: "((s) => Array.isArray(s) ? s.length : ((s?.bottom?.length) || (s?.main?.length) || 0))(card?.sub_button) >= 2"
      schema:
        # ---- section 2 ----
        - name: color_2
          label: Section 2 color (hex, blank = follow the entity's HA color, approximated)
          prefix: '#'
          visible_if: "((s) => Array.isArray(s) ? s.length : ((s?.bottom?.length) || (s?.main?.length) || 0))(card?.sub_button) >= 2"
          selector:

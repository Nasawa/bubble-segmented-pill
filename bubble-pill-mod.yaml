        - name: mode_2
          label: Section 2 color source (when color is blank)
          visible_if: "((s) => Array.isArray(s) ? s.length : ((s?.bottom?.length) || (s?.main?.length) || 0))(card?.sub_button) >= 2"
          selector:
            select:
              mode: dropdown
              options:
